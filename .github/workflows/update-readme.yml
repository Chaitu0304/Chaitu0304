name: 🔄 Auto-Update README

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

# ✅ Grant write permission to push back to the repo
permissions:
  contents: write

jobs:
  update-readme:
    name: Refresh Dynamic Sections
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ✅ Suppress Node.js 20 warning

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🔄 Fetch latest repos & update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Chaitu0304
        run: python update_readme.py

      - name: 💾 Commit & push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add README.md
          git diff --staged --quiet || git commit -m "🤖 Auto-update README [$(date +'%Y-%m-%d')]"
          git push
